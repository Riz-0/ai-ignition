<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — 2am Shoppers</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">

  <header class="auth-top">
    <a href="index.html" class="brand">
      <span class="brand-icon">🛒</span>
      <span class="brand-name">2am Shoppers</span>
    </a>
    <div class="nav-right">
      <div class="lang" id="lang">
        <button class="lang-btn" id="lang-btn" aria-haspopup="true" aria-expanded="false">
          <span id="lang-flag">🇬🇧</span><span id="lang-label">EN</span><span class="caret">▾</span>
        </button>
        <div class="lang-menu" id="lang-menu" role="menu">
          <button class="lang-opt" data-lang="en">🇬🇧 <span>English</span></button>
          <button class="lang-opt" data-lang="ja">🇯🇵 <span>日本語</span></button>
          <button class="lang-opt" data-lang="zh">🇨🇳 <span>中文</span></button>
          <button class="lang-opt" data-lang="th">🇹🇭 <span>ไทย</span></button>
          <button class="lang-opt" data-lang="ko">🇰🇷 <span>한국어</span></button>
        </div>
      </div>
      <button class="theme-btn" id="theme-btn" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <div class="auth-emoji">👋</div>
        <h1 class="auth-title" data-i18n="loginTitle">Welcome back</h1>
        <p class="auth-sub" data-i18n="loginSub">Sign in to pick up where you left off.</p>
      </div>

      <div class="demo-hint">⚡ <span data-i18n="demoHint">Try the demo — user: <strong>user</strong> · pass: <strong>password</strong></span></div>

      <form class="auth-form" id="form-signin" onsubmit="handleSignin(event)">
        <input class="auth-input" id="signin-username" type="text" autocomplete="username" data-i18n-ph="phUsername2" placeholder="Username" required autofocus />
        <div class="pw-wrap">
          <input class="auth-input" id="signin-password" type="password" autocomplete="current-password" data-i18n-ph="phPassword2" placeholder="Password" required />
          <button type="button" class="pw-toggle" onclick="togglePw('signin-password', this)" aria-label="Show password">👁️</button>
        </div>
        <div class="auth-error" id="signin-error" aria-live="polite"></div>
        <button type="submit" class="btn-primary-lg full" id="signin-btn" data-i18n="signinBtn">Sign in &amp; open the app →</button>
      </form>

      <p class="auth-switch">
        <span data-i18n="newHere">New here?</span>
        <a href="signup.html" data-i18n="createLink">Create an account</a>
      </p>
    </div>

    <a href="index.html" class="auth-back" data-i18n="backHome">← Back to home</a>
  </main>

  <!-- Handoff overlay -->
  <div class="overlay" id="congrats-overlay">
    <div class="overlay-box" id="congrats-box">
      <button class="overlay-close" id="congrats-close" aria-label="Close">✕</button>
      <div class="overlay-emoji" id="congrats-emoji">🎉</div>
      <h2 class="overlay-title" id="congrats-title">You're in!</h2>
      <p class="overlay-sub" id="congrats-sub">Opening your shopping buddy…</p>
      <a id="congrats-btn" href="#" target="_blank" rel="noopener" class="btn-primary-lg full">Open the app →</a>
      <p class="overlay-small" id="congrats-small">Didn't open? Make sure the app is running, then tap the button.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
